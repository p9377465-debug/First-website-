<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | VoltCart</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="login"><header id="hdr"></header>
<main>
<div class="box" style="max-width:420px;margin:30px auto"><div class="tabs"><button class="btn" id="ti" type="button">Login</button><button class="btn alt" id="tu" type="button">Sign up</button></div>
<form id="f" style="margin-top:16px"><div id="nm"><label for="name">Full name</label><input id="name" autocomplete="name"></div>
<div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
<div><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
<div class="err" id="err" role="alert"></div><button class="btn" id="sub">Login</button></form></div>
</main>
<footer>VoltCart · College project demo store · No real payments</footer>
<div id="toast" role="status"></div>
<script src="js/data.js"></script><script src="js/app.js"></script></body></html>
